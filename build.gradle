plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'ru.rapidcoder.gemini.bot.Main'
}

checkstyle {
    toolVersion = '10.12.4'
    ignoreFailures = false
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = false
    }
}

def getVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
        }
        def tag = stdout.toString().trim()
        if (tag.startsWith('v')) {
            tag = tag.substring(1)
        }
        return tag ?: '0.0.1-SNAPSHOT'
    } catch (Exception e) {
        return '0.0.1-SNAPSHOT'
    }
}

def getBuildNumber = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return '1'
    }
}

def getGitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return 'unknown'
    }
}

version = getVersionName()
def buildNumber = getBuildNumber()
def gitHash = getGitHash()

jar {
    archiveBaseName = 'geminiBot'
    archiveVersion = project.version

    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': "${version}-${buildNumber}",
                'Implementation-Build': buildNumber,
                'Git-Commit-Hash': gitHash,
                'Build-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Main-Class': application.mainClass.get()
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
    implementation("org.slf4j:slf4j-api:2.0.18")
    implementation("ch.qos.logback:logback-core:1.5.34")
    implementation("ch.qos.logback:logback-classic:1.5.34")

    implementation("org.telegram:telegrambots:6.9.7.1")
    implementation("org.telegram:telegrambotsextensions:6.9.7.1")

    implementation("com.google.genai:google-genai:1.59.0")
    implementation("com.alibaba:dashscope-sdk-java:2.22.23")

    implementation ("org.xerial:sqlite-jdbc:3.53.2.0")
    implementation ("org.flywaydb:flyway-core:11.18.0")
    implementation ("com.zaxxer:HikariCP:7.1.0")
    implementation ("org.hibernate.orm:hibernate-core:7.4.2.Final")
    implementation ("org.hibernate.orm:hibernate-community-dialects:7.4.2.Final")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.junit.jupiter:junit-jupiter:5.14.4")
    testImplementation("org.mockito:mockito-junit-jupiter:5.23.0")
    testImplementation("org.mockito:mockito-core:5.23.0")
    testImplementation("org.mockito:mockito-inline:5.2.0")

    testRuntimeOnly("org.junit.vintage:junit-vintage-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }

    minHeapSize = "512m"
    maxHeapSize = "1024m"

    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.15"
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.1 // 10% coverage
            }
        }
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true

        html.outputLocation = layout.buildDirectory.dir("${rootDir}/reports/jacoco/html")

        afterEvaluate {
            classDirectories.setFrom(files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                        '**/config/**'
                ])
            }))
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
